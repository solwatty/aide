[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aide"
version = "0.1.0"
description = "Correlate your Apple Health stress signals with the meetings, colleagues, clients and topics that drive them."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.6"]

[project.scripts]
aide = "aide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
